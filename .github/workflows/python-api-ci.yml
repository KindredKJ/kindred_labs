name: Kindred Labs Python API Integration

on:
  pull_request:
    paths:
      - "app/**"
      - "pyproject.toml"
      - "tests/test_api_smoke.py"
      - ".github/workflows/python-api-ci.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "pyproject.toml"
      - "tests/test_api_smoke.py"
      - ".github/workflows/python-api-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install application and ASGI test client
        run: python -m pip install -e . "httpx>=0.28,<1"
      - name: Compile application and tests
        run: python -m compileall -q app tests
      - name: Verify homepage, OpenAPI schema, and API contracts
        run: python -m unittest discover -s tests -p "test_api_smoke.py" -v
